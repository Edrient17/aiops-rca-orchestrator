name: aiops-rca-orchestrator

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  # Applies database/migrations to an existing database, not just a new one.
  #
  # These files used to be mounted at /docker-entrypoint-initdb.d, which the
  # postgres image runs only when the data directory is empty. postgres_data is
  # a persistent volume, so every file added after the first start -- the
  # feedback tables, the message-dedup index, the execution link column -- was
  # never applied to a deployment that already existed, and `docker compose up`
  # reported success while ingress ran against a schema missing the columns it
  # writes to.
  #
  # Every file is re-applied on every start, in filename order, so a file may be
  # amended in place and the change still lands. That requires each one to stay
  # idempotent: CREATE ... IF NOT EXISTS, ADD COLUMN IF NOT EXISTS, and DROP VIEW
  # IF EXISTS before a view rather than CREATE OR REPLACE, which refuses to
  # replace a view whose columns changed. There is deliberately no ledger of
  # applied filenames, because one would silently skip those in-place amendments.
  db-migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-aiops}
      PGDATABASE: ${POSTGRES_DB:-aiops}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    entrypoint: ["/bin/sh", "-c"]
    # --single-transaction is per file, not per run: a file that fails applies
    # none of itself and exits non-zero, and set -e stops the loop there, but
    # the files before it stay applied. The run is not atomic. What makes a
    # stop safe is idempotency -- the next run repeats everything from 001 --
    # and the non-zero exit, which leaves ingress waiting rather than started
    # against a schema that only got partway.
    command:
      - >-
        set -e;
        for file in /migrations/*.sql; do
          echo "applying $${file##*/}";
          psql -v ON_ERROR_STOP=1 --single-transaction -q -f "$$file";
        done;
        echo "schema up to date"
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  ingress:
    build:
      context: ./ingress
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiops}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:?SLACK_SIGNING_SECRET is required}
      SLACK_QUESTION_CHANNEL_ID: ${SLACK_QUESTION_CHANNEL_ID:?SLACK_QUESTION_CHANNEL_ID is required}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      SLACK_APP_ID: ${SLACK_APP_ID:-}
      SLACK_ALLOWED_USER_IDS: ${SLACK_ALLOWED_USER_IDS:-}
      # Only used to ask for a written correction after a negative verdict.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_LABEL_REACTIONS: ${SLACK_LABEL_REACTIONS:-white_check_mark=correct,heavy_check_mark=correct,thinking_face=partial,x=incorrect}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN is required}
      DISPATCH_INTERVAL_MS: ${DISPATCH_INTERVAL_MS:-1000}
      DISPATCH_TIMEOUT_MS: ${DISPATCH_TIMEOUT_MS:-10000}
      RCA_API_URL: ${RCA_API_URL:-http://rca-api:8090}
      # Answers are published here, which is not the channel questions arrive on.
      SLACK_ANSWER_CHANNEL_ID: ${SLACK_ANSWER_CHANNEL_ID:-}
      RCA_TIMEOUT_MS: ${RCA_TIMEOUT_MS:-900000}
      SLACK_POST_TIMEOUT_MS: ${SLACK_POST_TIMEOUT_MS:-30000}
      # Where a footnote leads. Absent, a citation degrades to a bare id.
      ZABBIX_FRONTEND_URL: ${ZABBIX_FRONTEND_URL:-}
      KIBANA_URL: ${KIBANA_URL:-}
      KIBANA_DATA_VIEW_ID: ${KIBANA_DATA_VIEW_ID:-}
      TEMPLATE_DIR: /opt/aiops/templates
      # Which Zabbix host group the monthly report covers. Lives here rather
      # than in the template so the file stays true for any installation.
      AIOPS_MONTHLY_HOST_GROUP_ID: ${AIOPS_MONTHLY_HOST_GROUP_ID:-}
    # Mounted rather than built in: the templates decide which reports exist, so
    # editing one is a file change and a restart, not an image rebuild.
    volumes:
      - ./templates:/opt/aiops/templates:ro
    ports:
      - "127.0.0.1:${AIOPS_INGRESS_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Held back until the schema matches this checkout, so a deploy that adds
      # a column cannot start ingress against a database that lacks it.
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - edge

  rca-api:
    build:
      context: ./rca-api
    restart: unless-stopped
    environment:
      PORT: 8090
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      RCA_QUESTION_MODEL: ${RCA_QUESTION_MODEL:-gpt-5.6-luna}
      RCA_REASONING_MODEL: ${RCA_REASONING_MODEL:-gpt-5.6-terra}
      RCA_ROUTINE_MODEL: ${RCA_ROUTINE_MODEL:-gpt-5.6-luna}
      RCA_WRITER_MODEL: ${RCA_WRITER_MODEL:-gpt-5.6-terra}
      ZABBIX_MCP_URL: ${ZABBIX_MCP_URL:?ZABBIX_MCP_URL is required}
      ZABBIX_MCP_AUTH_TOKEN: ${ZABBIX_MCP_AUTH_TOKEN:?ZABBIX_MCP_AUTH_TOKEN is required}
      OSS_ES_MCP_URL: ${OSS_ES_MCP_URL:?OSS_ES_MCP_URL is required}
      WAZUH_MCP_URL: ${WAZUH_MCP_URL:?WAZUH_MCP_URL is required}
      WAZUH_MCP_AUTH_TOKEN: ${WAZUH_MCP_AUTH_TOKEN:?WAZUH_MCP_AUTH_TOKEN is required}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-aiops-rca}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-120}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      AIOPS_DOMAIN: ${AIOPS_DOMAIN:?AIOPS_DOMAIN is required for proxy profile}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ingress:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
