name: aiops-rca-orchestrator

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  # Applies database/migrations to an existing database, not just a new one.
  #
  # These files used to be mounted at /docker-entrypoint-initdb.d, which the
  # postgres image runs only when the data directory is empty. postgres_data is
  # a persistent volume, so every file added after the first start -- the
  # feedback tables, the message-dedup index, the execution link column -- was
  # never applied to a deployment that already existed, and `docker compose up`
  # reported success while ingress ran against a schema missing the columns it
  # writes to.
  #
  # Every file is re-applied on every start, in filename order, so a file may be
  # amended in place and the change still lands. That requires each one to stay
  # idempotent: CREATE ... IF NOT EXISTS, ADD COLUMN IF NOT EXISTS, and DROP VIEW
  # IF EXISTS before a view rather than CREATE OR REPLACE, which refuses to
  # replace a view whose columns changed. There is deliberately no ledger of
  # applied filenames, because one would silently skip those in-place amendments.
  db-migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-aiops}
      PGDATABASE: ${POSTGRES_DB:-aiops}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    entrypoint: ["/bin/sh", "-c"]
    # --single-transaction is per file, not per run: a file that fails applies
    # none of itself and exits non-zero, and set -e stops the loop there, but
    # the files before it stay applied. The run is not atomic. What makes a
    # stop safe is idempotency -- the next run repeats everything from 001 --
    # and the non-zero exit, which leaves ingress waiting rather than started
    # against a schema that only got partway.
    command:
      - >-
        set -e;
        for file in /migrations/*.sql; do
          echo "applying $${file##*/}";
          psql -v ON_ERROR_STOP=1 --single-transaction -q -f "$$file";
        done;
        echo "schema up to date"
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  ingress:
    build:
      context: ./ingress
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiops}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:?SLACK_SIGNING_SECRET is required}
      SLACK_QUESTION_CHANNEL_ID: ${SLACK_QUESTION_CHANNEL_ID:?SLACK_QUESTION_CHANNEL_ID is required}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      SLACK_APP_ID: ${SLACK_APP_ID:-}
      SLACK_ALLOWED_USER_IDS: ${SLACK_ALLOWED_USER_IDS:-}
      # Only used to ask for a written correction after a negative verdict.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_LABEL_REACTIONS: ${SLACK_LABEL_REACTIONS:-white_check_mark=correct,heavy_check_mark=correct,thinking_face=partial,x=incorrect}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN is required}
      N8N_INTERNAL_WEBHOOK_URL: ${N8N_INTERNAL_WEBHOOK_URL:-http://n8n:5678/webhook/aiops-process}
      DISPATCH_INTERVAL_MS: ${DISPATCH_INTERVAL_MS:-1000}
      DISPATCH_TIMEOUT_MS: ${DISPATCH_TIMEOUT_MS:-10000}
      TEMPLATE_DIR: /opt/aiops/templates
      # Which Zabbix host group the monthly report covers. Lives here rather
      # than in the template so the file stays true for any installation.
      AIOPS_MONTHLY_HOST_GROUP_ID: ${AIOPS_MONTHLY_HOST_GROUP_ID:-}
    # Mounted rather than built in: the templates decide which reports exist, so
    # editing one is a file change and a restart, not an image rebuild.
    volumes:
      - ./templates:/opt/aiops/templates:ro
    ports:
      - "127.0.0.1:${AIOPS_INGRESS_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Held back until the schema matches this checkout, so a deploy that adds
      # a column cannot start ingress against a database that lacks it.
      db-migrate:
        condition: service_completed_successfully
      n8n:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
      - edge

  n8n-import:
    image: n8nio/n8n:2.32.6
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # Guarded by a marker in the n8n data volume rather than `n8n list:workflow`.
    # That command does not reliably exit once workflows exist, and a shell waits
    # for every process in a pipeline, so `list | grep -q` hung here and blocked
    # the whole stack behind depends_on: service_completed_successfully.
    #
    # Bounding it with a timeout would trade the hang for a worse failure: an
    # empty result reads as "not imported yet" and the re-import would discard
    # whatever was edited in the UI, including credential assignments. A marker
    # cannot produce that false negative.
    #
    # To deliberately re-import, delete the marker:
    #   docker compose run --rm --entrypoint sh n8n-import -c \
    #     'rm -f /home/node/.n8n/.aiops-workflows-imported'
    command:
      - >-
        set -e;
        marker=/home/node/.n8n/.aiops-workflows-imported;
        if [ -f "$$marker" ]; then
          echo "workflows already bootstrapped; skipping import";
          exit 0;
        fi;
        n8n import:workflow --input=/opt/aiops/workflows/99-aiops-error-handler.json;
        n8n import:workflow --input=/opt/aiops/workflows/01-aiops-main.json;
        touch "$$marker";
        echo "workflows imported and marker written"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-aiops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aiops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/opt/aiops/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  rca-api:
    build:
      context: ./rca-api
    restart: unless-stopped
    environment:
      PORT: 8090
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN:?AIOPS_INTERNAL_TOKEN is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      RCA_QUESTION_MODEL: ${RCA_QUESTION_MODEL:-gpt-5.4-mini}
      RCA_INVESTIGATION_MODEL: ${RCA_INVESTIGATION_MODEL:-gpt-5.6-terra}
      RCA_WRITER_MODEL: ${RCA_WRITER_MODEL:-gpt-5.4-mini}
      ZABBIX_MCP_URL: ${ZABBIX_MCP_URL:?ZABBIX_MCP_URL is required}
      ZABBIX_MCP_AUTH_TOKEN: ${ZABBIX_MCP_AUTH_TOKEN:?ZABBIX_MCP_AUTH_TOKEN is required}
      OSS_ES_MCP_URL: ${OSS_ES_MCP_URL:?OSS_ES_MCP_URL is required}
      WAZUH_MCP_URL: ${WAZUH_MCP_URL:?WAZUH_MCP_URL is required}
      WAZUH_MCP_AUTH_TOKEN: ${WAZUH_MCP_AUTH_TOKEN:?WAZUH_MCP_AUTH_TOKEN is required}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-120}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend
      - edge

  n8n:
    image: n8nio/n8n:2.32.6
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-aiops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-aiops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_HOST: ${AIOPS_DOMAIN:-localhost}
      N8N_PROTOCOL: ${AIOPS_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${AIOPS_PUBLIC_URL:-http://localhost:5678}
      WEBHOOK_URL: ${AIOPS_PUBLIC_URL:-http://localhost:5678}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
      AIOPS_INTERNAL_TOKEN: ${AIOPS_INTERNAL_TOKEN}
      AIOPS_CONTROL_URL: http://ingress:8080
      RCA_EXECUTION_MODE: ${RCA_EXECUTION_MODE:-legacy}
      RCA_API_URL: ${RCA_API_URL:-http://rca-api:8090}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN is required}
      SLACK_ANSWER_CHANNEL_ID: ${SLACK_ANSWER_CHANNEL_ID:?SLACK_ANSWER_CHANNEL_ID is required}
      SLACK_ERROR_CHANNEL_ID: ${SLACK_ERROR_CHANNEL_ID:?SLACK_ERROR_CHANNEL_ID is required}
      ZABBIX_MCP_URL: ${ZABBIX_MCP_URL:?ZABBIX_MCP_URL is required}
      OSS_ES_MCP_URL: ${OSS_ES_MCP_URL:?OSS_ES_MCP_URL is required}
      WAZUH_MCP_URL: ${WAZUH_MCP_URL:?WAZUH_MCP_URL is required}
      ZABBIX_FRONTEND_URL: ${ZABBIX_FRONTEND_URL:-}
      KIBANA_URL: ${KIBANA_URL:-}
      KIBANA_DATA_VIEW_ID: ${KIBANA_DATA_VIEW_ID:-}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/opt/aiops/workflows:ro
      - ./prompts:/opt/aiops/prompts:ro
      - ./schemas:/opt/aiops/schemas:ro
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      # Every write n8n makes goes through ingress, which already waits for the
      # schema, so today this is redundant. It is stated anyway because that
      # redundancy is an accident of the dependency graph rather than anything
      # n8n guarantees about itself: n8n is published on 127.0.0.1:5678 and a
      # workflow can be run by hand from the host, and the day one grows a node
      # that reaches the database directly, the protection would vanish without
      # a single line here changing.
      db-migrate:
        condition: service_completed_successfully
      rca-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      AIOPS_DOMAIN: ${AIOPS_DOMAIN:?AIOPS_DOMAIN is required for proxy profile}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ingress:
        condition: service_healthy
      n8n:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
