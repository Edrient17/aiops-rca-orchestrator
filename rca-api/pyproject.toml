[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aiops-rca-api"
version = "0.1.0"
description = "LangGraph diagnostic reasoning service for the AIOps RCA orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  # Pulled in transitively, named here because tracing.py imports it directly.
  "langsmith>=0.10,<1",
  "mcp>=1.29,<2",
  "openai>=3,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  # ZoneInfo reads the operating system's tz database, which Windows does not
  # have. Every window this service resolves is timezone-bound, so without this
  # the calendar-month branch cannot even be exercised off Linux -- it was the
  # one path with no test, and that is why.
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26,<5",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.16,<1",
]

[project.scripts]
aiops-rca-api = "aiops_rca.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_rca"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]
