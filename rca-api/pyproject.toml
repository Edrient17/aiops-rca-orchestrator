[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aiops-rca-api"
version = "0.1.0"
description = "LangGraph diagnostic reasoning service for the AIOps RCA orchestrator"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26,<5",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_rca"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]
