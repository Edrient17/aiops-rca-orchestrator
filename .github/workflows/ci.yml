name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingress:
    name: ingress (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingress
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    # postgres-repository.ts is the largest file here and every other suite
    # replaces it with an object literal, so its SQL -- the claim under FOR
    # UPDATE SKIP LOCKED, the upsert that has to catch two different keys, the
    # guard that stops a late failure retracting a published report -- was
    # carried by its comments alone. The suite skips itself when
    # TEST_DATABASE_URL is unset, so this is what makes it run.
    #
    # The image is the one the deployment runs, because the behaviour under
    # test is the database's rather than the driver's.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ingress/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      - run: npm run build


  # rca-api owns every model call, the investigation graph and the contracts the
  # reports are written against, and its suite ran only where someone remembered
  # to run it. Removing n8n made it the only thing between ingress and an answer.
  rca-api:
    name: rca-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rca-api
    steps:
      - uses: actions/checkout@v5

      # The version the image ships. Testing one it is not built on would report
      # a compatibility this deployment never relies on.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rca-api/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build ingress image
        run: docker build -t aiops-ingress:ci ingress

      - name: Build rca-api image
        run: docker build -t aiops-rca-api:ci rca-api
